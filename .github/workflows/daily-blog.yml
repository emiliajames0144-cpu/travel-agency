name: Write and publish a daily blog

on:
  # 10:17 each day in Pakistan Standard Time (UTC+5); avoid the top of the hour.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: serein-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Generate one checked article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: node scripts/publish-daily-blog.mjs

      - name: Save the published article in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blogs.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily Serein travel article"
            git push
          fi

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Collect the static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
